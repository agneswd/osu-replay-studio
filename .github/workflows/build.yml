name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v7
        if: runner.os == 'Linux'
        with:
          go-version: '1.24.1'
          cache-dependency-path: tools/danser-pipe.patch
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgl1-mesa-dev libgtk-3-dev xvfb
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run test
      - run: bun run build
      - name: Check captured frames on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a bunx electron tests/capture.cjs --disable-gpu
      - name: Check captured frames on Windows
        if: runner.os == 'Windows'
        run: bunx electron tests/capture.cjs --disable-gpu
      - run: node tools/package.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes
